[project]
name = "stat3d"
version = "0.1.0"
description = "Spatial Transcriptomics Analysis Tool 3D"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
# System and build tools
git = ">=2.40"
wget = ">=1.21"
curl = ">=7.85"
pkg-config = ">=1.8"

# NVIDIA/CUDA (for GPU support)
cuda-version = "12.6"

# Core scientific computing
python = "3.10"
numpy = ">=1.24"
scipy = ">=1.10"

# Image processing and analysis
openjdk = "11"
quarto = ">=1.3"

# Workflow orchestration
nextflow = ">=23.0"
snakemake = ">=7.0"

# R and base packages
r-base = ">=4.3"
r-irkernel = "*"
r-curl = "*"
r-ragg = "*"

# Python packages (PyTorch with CUDA)
pytorch::pytorch = "2.6.0"
pytorch::pytorch-cuda = "12.6"
pytorch::torchvision = "0.21.0"
pytorch::torchaudio = "2.6.0"
pyarrow = ">=13.0"
numba = ">=0.57"
natsort = ">=8.4"

# R packages - core dependencies
r-tidyverse = "*"
r-seurat = "*"
r-pheatmap = "*"
r-complexheatmap = "*"
r-patchwork = "*"
r-ggrepel = "*"
r-readxl = "*"
r-data-table = "*"
r-plotly = "*"
r-viridis = "*"
r-rgl = "*"
r-remotes = "*"
r-matrix = "*"

# R packages - Bioconductor (data structures and utilities)
bioconda::r-iranges = "*"
bioconda::r-summarizedexperiment = "*"
bioconda::r-biobase = "*"
bioconda::r-s4vectors = "*"
bioconda::r-seuratobject = "*"

# R packages - analysis and visualization
bioconda::r-enhancedvolcano = "*"
bioconda::r-sctransform = "*"

# R packages - newly requested Bioconductor packages
bioconda::r-scuttle = "*"
bioconda::r-singler = "*"
bioconda::r-celldex = "*"
bioconda::r-scrnaseq = "*"

# R packages - utilities
r-geosphere = "*"

# Python packages for image processing
cellpose = "3.1.0"
scikit-image = ">=0.20"
tifffile = ">=2023.0"

[pypi-dependencies]
# Add any PyPI-only packages here if needed
# setuptools = ">=65.0"
# pyqtgraph = ">=0.13"
# PyQt5 = ">=5.15"

[tasks]
# Task to run snakemake
run-pipeline = "snakemake --cores 1"
run-pipeline-gpu = "snakemake --cores 1"

# Task to verify installations
verify = { cmd = "bash -c 'echo \"=== Verifying installations ===\"; java -version; nextflow -version; snakemake --version; quarto --version; R --version; R -e \"cat(\\\"R packages loaded successfully\\n\\\")\"'" }

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
