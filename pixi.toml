[workspace]
name = "stat3d"
version = "0.1.0"
description = "Spatial Transcriptomics Analysis Tool 3D"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
# System and build tools
git = ">=2.40"
wget = "*"
curl = "*"
pkg-config = "*"

# NVIDIA/CUDA (for GPU support)
cuda-version = "12.6.*"

# Core scientific computing
python = "3.10.*"
pip = "*"
setuptools = "<81"
numpy = ">=1.24"
scipy = ">=1.10"

# Image processing and analysis
openjdk = ">=11,<12"
quarto = ">=1.3"

# Workflow orchestration
nextflow = ">=23.0"
snakemake = ">=7.0"

# R and base packages
r-base = ">=4.3"
r-irkernel = "*"
r-curl = "*"
r-ragg = "*"

# Python packages (note: PyTorch installed via pip for CUDA support)
# pytorch, torchvision, torchaudio installed via pip in Dockerfile for guaranteed CUDA binaries
pyarrow = "*"
numba = "*"
natsort = "*"

# R packages - core dependencies
r-tidyverse = "*"
r-seurat = "*"
r-pheatmap = "*"
bioconductor-complexheatmap = "*"
r-patchwork = "*"
r-ggrepel = "*"
r-readxl = "*"
# r-data.table = "*"  # Temporarily removed to debug build issue
r-plotly = "*"
r-viridis = "*"
r-rgl = "*"
r-remotes = "*"
r-matrix = "*"

# R packages - Bioconductor (data structures and utilities)
r-biocmanager = "*"
bioconductor-iranges = "*"
bioconductor-summarizedexperiment = "*"
bioconductor-biobase = "*"
bioconductor-s4vectors = "*"
bioconductor-genomeinfodbdata = "*"
r-seuratobject = "*"
r-cowplot = "*"

# R packages - analysis and visualization
bioconductor-enhancedvolcano = "*"
# bioconductor-sctransform = "*"  # Not found in bioconda, may need manual installation

# R packages - newly requested Bioconductor packages
bioconductor-scuttle = "*"
bioconductor-singler = "*"
bioconductor-celldex = "*"
bioconductor-scrnaseq = "*"
bioconductor-glmgampoi = "*"

# R packages - utilities
r-geosphere = "*"

# Python packages for image processing
cellpose = "3.1.0.*"
scikit-image = ">=0.20"
tifffile = ">=2023.0"

[pypi-dependencies]
# Add any PyPI-only packages here if needed
# pyqtgraph = ">=0.13"
# PyQt5 = ">=5.15"

[tasks]
# Task to run snakemake
run-pipeline = "snakemake --cores 1"
run-pipeline-gpu = "snakemake --cores 1"

# Task to verify installations
verify = { cmd = "bash -c 'echo \"=== Verifying installations ===\"; java -version; nextflow -version; snakemake --version; quarto --version; R --version; R -e \"cat(\\\"R packages loaded successfully\\n\\\")\"'" }

# Task to display system and package information
sysinfo = { cmd = "bash -c 'echo \"=== STAT3D System Information ===\"; echo \"\"; echo \"Container built: $(date -r /etc/stat3d/pixi.toml +\"%Y-%m-%d %H:%M\")\" 2>/dev/null || true; echo \"Pixi version: $(pixi --version)\"; echo \"\"; echo \"=== Python Environment ===\"; python --version; echo \"\"; echo \"=== Python Packages ===\"; pip list; echo \"\"; echo \"=== R Environment ===\"; R --version | head -n1; echo \"\"; echo \"=== R Packages ===\"; R -e \"ip <- installed.packages()[,c(1,3)]; print(as.data.frame(ip), row.names=FALSE)\" 2>/dev/null; echo \"\"; echo \"=== Conda/Pixi Packages ===\"; pixi list'" }

# Task to run stat3d wrapper (calls the installed wrapper script)
stat3d = { cmd = "/usr/local/bin/stat3d" }
