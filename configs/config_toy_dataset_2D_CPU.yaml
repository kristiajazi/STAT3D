# STAT3D configuration file

# Set working directory
directory: /test

# MEMORY SETTINGS
# Optional memory floor (MB). Use 0 for automatic sizing (HPC Clusters auto-scaling).
# Set to ~85% of total RAM on laptops (e.g. 28000 for 32GB).
memory_mb: 0

# ROBUSTNESS
# If True: Automatically switch to CPU if GPU runs out of memory (slower but guarantees completion).
# If False: Fail if GPU cannot handle the image.
fallback_to_cpu: true

#z extraction for image reduction
INPUT_TIFF: /data/TC70_cropped.ome.tif
#Z_SLICE_A: 6
#Z_SLICE_B: 7
LEVEL: 0

# QuPath parameters
CELL_EXPANSION: 2.0
SIGMA: 1.0
THRESHOLD: 30.0
MIN_AREA: 10.0
MAX_AREA: 1000.0
BACKGROUND_RADIUS: 10.0
MEDIAN_RADIUS: 0.0

#Image measurements 
sample_size: 15000

#Cellpose
cellpose_use_gpu: false
cellpose_img_filter : TC70_cropped.ome_STAT3D
cellpose_do_3D: false

#Cell-to-transcript files and parameters
transcripts_df: /data/transcriptsTC070.parquet

#SingleR Annotation
ref : HumanPrimaryCellAtlasData
label_column: label.main

#Level 2 pixel size 
PIXEL_SIZE: 0.85

#Z slice spacing 
Z_SLICE_MICRON: 3
