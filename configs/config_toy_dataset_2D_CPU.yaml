# STAT3D configuration file

# Set working directory
directory: /stat3d

#z extraction for image reduction
INPUT_TIFF: /stat3d/TC70_cropped.ome.tif
LEVEL: 0 # must be 0
#Z_1: 
#Z_2: 
#Z_3: 
#Z_4:
#Z_5:
#Z_6:
#Z_STACK: ALL
#Laplacian: HIGHEST 
#NUCLEAR_EXPANSION_SET: 5.0 


# QuPath parameters
CELL_EXPANSION: 2.0
SIGMA: 1.0
THRESHOLD: 30.0
MIN_AREA: 10.0
MAX_AREA: 1000.0
BACKGROUND_RADIUS: 10.0
MEDIAN_RADIUS: 0.0

#Image measurements 
sample_size: 15000

#Cellpose
cellpose_use_gpu: false
cellpose_do_3D: false
# ATTENTION: This value must be in MICRONS (µm).
# The pipeline will automatically convert it to pixels.
#nuclei_diameter: 30

#Cell-to-transcript files and parameters
transcripts_df: /data/transcriptsTC070.parquet

#SingleR Annotation
ref : HumanPrimaryCellAtlasData
label_column: label.main

#Level 0 pixel size 
PIXEL_SIZE: 0.2125 # must respect levels' size

#Z slice spacing 
Z_SLICE_MICRON: 3
